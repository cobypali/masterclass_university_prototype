<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterClass - Office Hours</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; }

    /* ==================== HEADER ==================== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      background: #0a0a0a;
      border-bottom: 1px solid #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .logo-img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border-radius: 4px;
      padding: 8px 14px;
      gap: 10px;
      min-width: 340px;
    }
    .search-bar svg { flex-shrink: 0; opacity: 0.5; }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: #999;
      font-size: 13px;
      width: 100%;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .my-progress { font-size: 13px; color: #ccc; white-space: nowrap; }
    .user-avatar { display: flex; align-items: center; gap: 8px; }
    .avatar-circle {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #e8a838, #c67b1a);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; color: #fff; text-transform: lowercase;
    }
    .username { font-size: 13px; color: #ccc; }
    .dropdown-arrow { opacity: 0.6; font-size: 10px; }

    /* ==================== FULLSCREEN CAMERA PROMPT ==================== */
    .cam-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }
    .cam-overlay.hidden { display: none; }
    .cam-overlay svg {
      width: 64px;
      height: 64px;
      opacity: 0.6;
    }
    .cam-overlay h2 {
      font-size: 22px;
      font-weight: 700;
    }
    .cam-overlay p {
      font-size: 15px;
      color: #999;
      max-width: 400px;
    }
    .enable-cam-btn {
      background: #e53935;
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .enable-cam-btn:hover { background: #c62828; }

    /* ==================== MAIN CONTENT (hidden until cam granted) ==================== */
    .page-content { display: none; }
    .page-content.visible { display: block; }

    .oh-content {
      padding: 24px 32px;
      height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 12px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
    .oh-header {
      margin-bottom: 20px;
    }
    .oh-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .oh-header p {
      font-size: 14px;
      color: #888;
    }

    /* ==================== SIDE BY SIDE VIDEO ==================== */
    .video-grid {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .video-panel {
      flex: 1;
      min-width: 0;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-panel video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 200px);
      display: block;
      background: #111;
      object-fit: contain;
    }
    .video-panel-webcam video {
      transform: scaleX(-1);
      object-fit: cover;
    }
    .video-panel-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2;
    }

    @media (max-width: 900px) {
      .video-grid { flex-direction: column; }
      .oh-content { height: auto; }
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="logo">
        <img src="Logo v04.png" alt="MasterClass" class="logo-img">
      </a>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Search Instructors, Classes, Topics and more" readonly>
      </div>
    </div>
    <div class="header-right">
      <a href="#" class="my-progress">My Progress</a>
      <div class="user-avatar">
        <span class="username">Coby Palivathukal</span>
        <div class="avatar-circle">C</div>
        <span class="dropdown-arrow">&#9662;</span>
      </div>
    </div>
  </header>

  <!-- ==================== CAMERA PROMPT OVERLAY ==================== -->
  <div class="cam-overlay" id="camOverlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
    </svg>
    <h2>Join Office Hours</h2>
    <p>Turn on your camera to start your 1:1 session.</p>
    <button class="enable-cam-btn" id="enableCamBtn">Turn On Camera</button>
  </div>

  <!-- ==================== PAGE CONTENT (hidden until cam on) ==================== -->
  <div class="page-content" id="pageContent">
    <div class="oh-content">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to Course
      </a>

      <div class="oh-header">
        <h1>Office Hours</h1>
        <p>Sam Altman &mdash; Building Companies that Shape the Future with AI</p>
      </div>

      <div class="video-grid">
        <!-- Office Hours Video (left) -->
        <div class="video-panel">
          <video id="ohVideo" controls preload="metadata" autoplay loop muted>
            <source src="3_OH.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>

        <!-- Webcam (right) -->
        <div class="video-panel video-panel-webcam">
          <video id="webcamVideo" autoplay playsinline muted></video>
          <div class="video-panel-label">You</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const enableCamBtn = document.getElementById('enableCamBtn');
    const camOverlay = document.getElementById('camOverlay');
    const pageContent = document.getElementById('pageContent');
    const webcamVideo = document.getElementById('webcamVideo');
    const ohVideo = document.getElementById('ohVideo');

    enableCamBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        webcamVideo.srcObject = stream;
        // Hide overlay, show page
        camOverlay.classList.add('hidden');
        pageContent.classList.add('visible');
        // Unmute and play the OH video
        ohVideo.muted = false;
        ohVideo.play();
      } catch (err) {
        alert('Camera access was denied. Please allow camera access to join office hours.');
      }
    });
  </script>

</body>
</html>
